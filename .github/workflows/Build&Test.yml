name: Test Project

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3

      - name: Install dependencies
        uses: npm install

      - name: Build frontend
        uses: npm run build

      - name: Run tests
        uses: npm test

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .next
